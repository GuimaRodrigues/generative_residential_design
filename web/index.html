<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Deterministic conceptual residential floor-plan generation and comparison.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Forma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Forma — Conceptual Residential Design</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    const loadForma3D = () =>
      window.forma3DReady ??= import('./scene3d.js');
    const reportForma3DError = (container, error) => {
      console.error('Unable to start the 3D renderer.', error);
      container.textContent = 'Unable to start the 3D renderer in this browser.';
      container.style.display = 'grid';
      container.style.placeItems = 'center';
      container.style.color = '#58676a';
      container.style.font = '13px Arial, sans-serif';
    };
    window.Forma3DBridge = {
      create: (container, sceneJson, callback) =>
        loadForma3D()
          .then((module) => module.create(container, sceneJson, callback))
          .catch((error) => reportForma3DError(container, error)),
      update: (container, sceneJson) =>
        loadForma3D()
          .then((module) => module.update(container, sceneJson))
          .catch((error) => reportForma3DError(container, error)),
      resetCamera: (container) =>
        loadForma3D()
          .then((module) => module.resetCamera(container))
          .catch((error) => reportForma3DError(container, error)),
      dispose: (container) =>
        loadForma3D()
          .then((module) => module.dispose(container))
          .catch((error) => console.error('Unable to dispose 3D.', error)),
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
